<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Không tìm thấy trang – Lịch Việt</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef0f5;
        --text: #111318;
        --muted: #5c6270;
        --accent: #cc2b22;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #07080c;
          --text: #f4f5f8;
          --muted: #a9afbd;
          --accent: #ff5a4f;
        }
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" width="72" height="72" />
      <h1>Không tìm thấy trang</h1>
      <p>Đường dẫn này không có trong Lịch Việt.</p>
      <a href="/">Mở lịch hôm nay</a>
    </main>
  </body>
</html>
