<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lịch Việt – Lịch âm dương Việt Nam, nhắc giỗ, rằm, mùng 1</title>
    <meta
      name="description"
      content="Xem lịch âm dương Việt Nam, Can Chi, ngày hoàng đạo, ngày lễ. Tạo sự kiện theo ngày âm như giỗ, rằm, mùng 1 và nhận nhắc hẹn. Miễn phí, dùng offline."
    />
    <!-- Head của trang chủ. Trang /day/YYYY-MM-DD có head riêng (scripts/prerenderDays.ts, usePageHead). -->
    <link rel="canonical" href="https://lich.thanhnghiep.top/" />
    <meta name="theme-color" content="#cc2b22" />

    <!-- Áp cỡ chữ đã chọn trước lần vẽ đầu tiên, tránh nháy cỡ mặc định (src/styles/textSize.ts). -->
    <script>
      try {
        var size = localStorage.getItem('hana:text-size')
        if (size === 'large' || size === 'xlarge')
          document.documentElement.setAttribute('data-text-size', size)
        if (localStorage.getItem('hana:bold-text') === '1')
          document.documentElement.setAttribute('data-bold-text', '')
      } catch (e) {}
    </script>

    <!-- Splash: hiện ngay khi HTML tới, trước khi tải JS; src/splash.ts gỡ khi app sẵn sàng.
         CSS viết inline vì theme.css chỉ có sau khi bundle tải xong. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(180deg, #f3f4f8 0%, #e9ecf3 100%);
        color: #5c6270;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        transition: opacity 0.25s ease;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      #splash .splash-name {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #111318;
      }
      #splash .splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgb(204 43 34 / 0.18);
        border-top-color: #cc2b22;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: linear-gradient(180deg, #0b0c11 0%, #07080c 100%);
          color: #a1a6b4;
        }
        #splash .splash-name {
          color: #f2f3f7;
        }
        #splash .splash-spinner {
          border-color: rgb(255 90 79 / 0.2);
          border-top-color: #ff5a4f;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Chia sẻ lên mạng xã hội (Facebook, Zalo, Messenger, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lịch Việt" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://lich.thanhnghiep.top/" />
    <meta property="og:title" content="Lịch Việt – Lịch âm dương Việt Nam" />
    <meta
      property="og:description"
      content="Xem lịch âm dương, Can Chi, ngày hoàng đạo. Nhắc giỗ, rằm, mùng 1 theo ngày âm. Miễn phí, dùng offline."
    />
    <meta property="og:image" content="https://lich.thanhnghiep.top/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo Lịch Việt với mặt trời và mặt trăng trên tờ lịch đỏ"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lịch Việt – Lịch âm dương Việt Nam" />
    <meta
      name="twitter:description"
      content="Xem lịch âm dương, Can Chi, ngày hoàng đạo. Nhắc giỗ, rằm, mùng 1 theo ngày âm."
    />
    <meta name="twitter:image" content="https://lich.thanhnghiep.top/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Lịch Việt",
        "url": "https://lich.thanhnghiep.top/",
        "description": "Lịch âm dương Việt Nam: Can Chi, ngày hoàng đạo, giờ tốt, ngày lễ, nhắc giỗ, rằm, mùng 1 theo ngày âm.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web, iOS, Android",
        "inLanguage": "vi",
        "image": "https://lich.thanhnghiep.top/og-image.jpg",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "VND" }
      }
    </script>
  </head>
  <body>
    <noscript>
      <style>
        #splash {
          display: none;
        }
      </style>
      <main style="max-width: 760px; margin: 0 auto; padding: 24px 16px; line-height: 1.6">
        <h1>Lịch Việt</h1>
        <p>
          Lịch cá nhân âm–dương Việt Nam: xem lịch ngày, tuần, tháng, lịch vạn niên, tạo sự kiện lặp
          theo ngày âm hoặc ngày dương và nhận nhắc hẹn. Dùng trên máy không cần tài khoản, hoặc
          đăng nhập Google để đồng bộ dữ liệu.
        </p>
        <p>Bật JavaScript để sử dụng lịch. Bạn vẫn có thể đọc các chính sách dưới đây.</p>
        <nav aria-label="Chính sách của Lịch Việt">
          <a href="/privacy">Quyền riêng tư</a> · <a href="/terms">Điều khoản sử dụng</a>
        </nav>
      </main>
    </noscript>
    <div id="root"></div>
    <div id="splash" role="status" aria-label="Đang tải Lịch Việt">
      <img src="/logo.png" alt="" width="96" height="96" />
      <p class="splash-name">Lịch Việt</p>
      <div class="splash-spinner" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

</html>
