name: CI / Deploy

on:
  # Branches get CI through their PR; push covers main only (no duplicate push+PR runs).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 22

jobs:
  prepare:
    name: Prepare dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse-audit: ${{ steps.reuse-audit.outputs.reuse }}
      p4-changed: ${{ steps.p4-changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect P4 mutation-gate changes
        id: p4-changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (manual run, new branch, fetch failure) runs the gates.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] ||
             [ "$BASE" = 0000000000000000000000000000000000000000 ] ||
             ! git fetch --depth=1 origin "$BASE" ||
             ! files=$(git diff --name-only "$BASE" HEAD); then
            echo changed=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(shared/lunar/p4|scripts/audit-p4-)'; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Find successful audit for merged content
        id: reuse-audit
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('reuse', 'false');
            if (context.eventName !== 'push' || context.ref !== 'refs/heads/main') return;
            try {
              const repo = context.repo;
              const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: context.sha });
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'ci.yml', event: 'pull_request', status: 'success', per_page: 100,
              });
              // P4 mutation gates may be skipped by path; a successful run means none failed.
              const requiredJobs = [
                'Typecheck and lint', 'Mutation and emulator gates',
                ...[1, 2, 3, 4].map(shard => `Unit tests (${shard}/4)`),
                ...['desktop'].flatMap(project =>
                  [1, 2].map(shard => `Playwright tests (${project}, ${shard}/2)`)),
              ];
              for (const run of data.workflow_runs) {
                if (run.conclusion !== 'success' ||
                    !run.head_branch ||
                    run.head_repository?.full_name !== `${repo.owner}/${repo.repo}` ||
                    run.head_commit?.tree_id !== commit.commit.tree.sha) continue;
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...repo, run_id: run.id, filter: 'latest', per_page: 100,
                });
                if (!requiredJobs.every(name => jobs.some(job =>
                    job.name === name && job.conclusion === 'success'))) continue;
                await core.summary.addHeading('Reusing successful branch audit')
                  .addLink('Identical Git tree; all audit jobs passed', run.html_url).write();
                core.setOutput('reuse', 'true');
                return;
              }
              core.info('No complete audit for identical content; running all checks.');
            } catch (error) {
              core.warning(`Could not verify previous audit; running all checks: ${error.message}`);
            }
      - name: Install dependencies
        run: |
          npm install --global npm@11
          npm ci
          npm ci --prefix functions
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}

  static-analysis:
    name: Typecheck and lint
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - run: npm run typecheck
      - run: npm run lint

  unit-tests:
    # Vitest split across parallel runners: the 1095-day migration suites dominate the run.
    name: Unit tests (${{ matrix.shard }}/4)
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - run: npm test -- --shard=${{ matrix.shard }}/4

  gates:
    name: Mutation and emulator gates
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Annual directional authority mutation gate
        run: python3 scripts/audit-annual-directions-mutations.py
      - name: Mansion content authority mutation gate
        run: python3 scripts/audit-mansion-content-mutations.py
      - run: npm run test:emulator

  p4-b-mutations:
    name: P4-B audit mutation gate
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true' && needs.prepare.outputs.p4-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - name: P4-B source, boundary and composition mutations
        run: python3 scripts/audit-p4-remaining-ji-mutations.py

  p4-c-mutations:
    name: P4-C audit mutation gate (${{ matrix.shard }}/4)
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true' && needs.prepare.outputs.p4-changed == 'true'
    runs-on: ubuntu-latest
    # Each mutation reruns every P4-C suite (~1 min local, ~4x on CI); 6 per shard + control.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - name: P4-C yi predicate, provider and composition mutations
        run: python3 scripts/audit-p4-yi-mutations.py --shard=${{ matrix.shard }}/4

  p5-warehouse-mutations:
    name: P5 warehouse audit mutation gate
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true' && needs.prepare.outputs.p4-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - name: P5 warehouse predicate and 開倉庫出貨財 mutations
        run: python3 scripts/audit-p4-warehouse-mutations.py

  p4b-puzhu06-mutations:
    name: P4-B puzhu:06 audit mutation gate
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true' && needs.prepare.outputs.p4-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - name: puzhu:06 composer mutations
        run: python3 scripts/audit-p4-puzhu06-mutations.py

  e2e-tests:
    name: Playwright tests (${{ matrix.project }}, ${{ matrix.shard }}/2)
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true'
    runs-on: ubuntu-latest
    container:
      # Giữ phiên bản khớp @playwright/test trong package-lock.json.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install dependencies in container
        run: |
          npm install --global npm@11
          npm ci --include=dev
          npm ci --prefix functions --include=dev
      - name: End-to-end tests
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        env:
          CI: true
      - name: Public pages on Vite dev
        run: npx playwright test --config playwright.dev.config.ts --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to Firebase
    needs:
      [
        prepare,
        static-analysis,
        unit-tests,
        gates,
        p4-b-mutations,
        p4-c-mutations,
        p5-warehouse-mutations,
        p4b-puzhu06-mutations,
        e2e-tests,
      ]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.reuse-audit == 'true' ||
       (needs.static-analysis.result == 'success' &&
        needs.unit-tests.result == 'success' && needs.gates.result == 'success' &&
        contains(fromJSON('["success","skipped"]'), needs.p4-b-mutations.result) &&
        contains(fromJSON('["success","skipped"]'), needs.p4-c-mutations.result) &&
        contains(fromJSON('["success","skipped"]'), needs.p5-warehouse-mutations.result) &&
        contains(fromJSON('["success","skipped"]'), needs.p4b-puzhu06-mutations.result) &&
        needs.e2e-tests.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::warning::Chưa có secret FIREBASE_SERVICE_ACCOUNT, bỏ qua deploy."
      - uses: actions/checkout@v4
        if: env.HAS_CREDENTIALS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CREDENTIALS == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        if: env.HAS_CREDENTIALS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - name: Install Firebase CLI
        if: env.HAS_CREDENTIALS == 'true'
        run: npm install --global firebase-tools
      - name: Build web app
        if: env.HAS_CREDENTIALS == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
      - name: Write functions/.env
        if: env.HAS_CREDENTIALS == 'true'
        run: |
          {
            echo "EMAIL_FROM=\"${EMAIL_FROM}\""
            echo "APP_URL=\"${APP_URL}\""
          } > functions/.env
        env:
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          APP_URL: ${{ vars.APP_URL }}
      - uses: google-github-actions/auth@v2
        if: env.HAS_CREDENTIALS == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        if: env.HAS_CREDENTIALS == 'true'
        run: firebase deploy --only firestore,hosting,functions --project calendar-hana --non-interactive --force
