name: CI / Deploy

on:
  push:
    branches: [main, 'feature/**', 'audit/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 22

jobs:
  prepare:
    name: Prepare dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse-audit: ${{ steps.reuse-audit.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Find successful audit for merged content
        id: reuse-audit
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('reuse', 'false');
            if (context.eventName !== 'push' || context.ref !== 'refs/heads/main') return;
            try {
              const repo = context.repo;
              const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: context.sha });
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'ci.yml', event: 'push', status: 'success', per_page: 100,
              });
              const requiredJobs = [
                'Typecheck and lint', 'Unit and emulator tests',
                ...['desktop'].flatMap(project =>
                  [1, 2].map(shard => `Playwright tests (${project}, ${shard}/2)`)),
              ];
              for (const run of data.workflow_runs) {
                if (run.conclusion !== 'success' ||
                    !/^(audit|feature)\//.test(run.head_branch || '') ||
                    run.head_repository?.full_name !== `${repo.owner}/${repo.repo}` ||
                    run.head_commit?.tree_id !== commit.commit.tree.sha) continue;
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...repo, run_id: run.id, filter: 'latest', per_page: 100,
                });
                if (!requiredJobs.every(name => jobs.some(job =>
                    job.name === name && job.conclusion === 'success'))) continue;
                await core.summary.addHeading('Reusing successful branch audit')
                  .addLink('Identical Git tree; all audit jobs passed', run.html_url).write();
                core.setOutput('reuse', 'true');
                return;
              }
              core.info('No complete audit for identical content; running all checks.');
            } catch (error) {
              core.warning(`Could not verify previous audit; running all checks: ${error.message}`);
            }
      - name: Install dependencies
        run: |
          npm install --global npm@11
          npm ci
          npm ci --prefix functions
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}

  static-analysis:
    name: Typecheck and lint
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - run: npm run typecheck
      - run: npm run lint

  unit-tests:
    name: Unit and emulator tests
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - run: npm test
      - run: npm run test:emulator

  e2e-tests:
    name: Playwright tests (${{ matrix.project }}, ${{ matrix.shard }}/2)
    needs: prepare
    if: needs.prepare.outputs.reuse-audit != 'true'
    runs-on: ubuntu-latest
    container:
      # Giữ phiên bản khớp @playwright/test trong package-lock.json.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PR/feature/audit CI intentionally gates only Desktop Chromium.
        # Mobile Safari/iPhone is covered by the periodic device suite instead.
        project: [desktop]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install dependencies in container
        run: |
          npm install --global npm@11
          npm ci --include=dev
          npm ci --prefix functions --include=dev
      - name: End-to-end tests
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        env:
          CI: true
      - name: Public pages on Vite dev
        run: npx playwright test --config playwright.dev.config.ts --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to Firebase
    needs: [prepare, static-analysis, unit-tests, e2e-tests]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.reuse-audit == 'true' ||
       (needs.static-analysis.result == 'success' &&
        needs.unit-tests.result == 'success' && needs.e2e-tests.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::warning::Chưa có secret FIREBASE_SERVICE_ACCOUNT, bỏ qua deploy."
      - uses: actions/checkout@v4
        if: env.HAS_CREDENTIALS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CREDENTIALS == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore dependencies
        if: env.HAS_CREDENTIALS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
      - name: Install Firebase CLI
        if: env.HAS_CREDENTIALS == 'true'
        run: npm install --global firebase-tools
      - name: Build web app
        if: env.HAS_CREDENTIALS == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
      - name: Write functions/.env
        if: env.HAS_CREDENTIALS == 'true'
        run: |
          {
            echo "EMAIL_FROM=\"${EMAIL_FROM}\""
            echo "APP_URL=\"${APP_URL}\""
          } > functions/.env
        env:
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          APP_URL: ${{ vars.APP_URL }}
      - uses: google-github-actions/auth@v2
        if: env.HAS_CREDENTIALS == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        if: env.HAS_CREDENTIALS == 'true'
        run: firebase deploy --only firestore,hosting,functions --project calendar-hana --non-interactive --force
