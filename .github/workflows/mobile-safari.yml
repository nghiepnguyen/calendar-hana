name: Daily Mobile Safari

on:
  schedule:
    - cron: '0 17 * * *' # 00:00 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  activity:
    name: Check previous-day pushes to main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should-run: ${{ steps.activity.outputs.should-run }}
    steps:
      - name: Check activity for previous Vietnamese calendar day
        id: activity
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should-run', 'true');
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            // Dùng thời điểm tạo run để rerun vẫn kiểm tra đúng ngày ban đầu.
            const offset = 7 * 60 * 60 * 1000;
            const local = new Date(Date.parse(run.created_at) + offset);
            const end = Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate()) - offset;
            const start = end - 24 * 60 * 60 * 1000;
            const created = `${new Date(start).toISOString()}..${new Date(end).toISOString()}`;
            const pushes = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', created, per_page: 100,
            });
            // Kể cả CI bị hủy/thất bại vẫn tính là có push; loại mốc đầu ngày hôm sau.
            const active = pushes.some(push => {
              const time = Date.parse(push.created_at);
              return time >= start && time < end;
            });
            core.info(`Previous Vietnamese day (${created}): ${active ? 'push found' : 'no pushes; skipping Safari'}`);
            core.setOutput('should-run', String(active));

  test:
    name: Mobile Safari (iPhone 15, ${{ matrix.shard }}/2)
    needs: activity
    if: needs.activity.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    container:
      # Giữ phiên bản khớp @playwright/test trong package-lock.json.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install dependencies in container
        run: |
          npm install --global npm@11
          npm ci --include=dev
          npm ci --prefix functions --include=dev
      - name: End-to-end tests
        run: npx playwright test --project=iphone --shard=${{ matrix.shard }}/2
        env:
          CI: true
      - name: Public pages on Vite dev
        run: npx playwright test --config playwright.dev.config.ts --project=iphone --shard=${{ matrix.shard }}/2
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-iphone-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
